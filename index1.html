<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Memory Matching Game</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            pointer-events: none;
        }
        .interactive-ui {
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div id="ui-overlay" class="p-4 d-flex justify-content-between align-items-start">
        <div class="bg-dark bg-opacity-75 p-3 rounded shadow text-white interactive-ui">
            <h1 class="h4 mb-2">3D Memory Game</h1>
            <div class="d-flex gap-4 fs-5">
                <div>Moves: <span id="move-count" class="badge bg-primary">0</span></div>
                <div>Matches: <span id="match-count" class="badge bg-success">0 / 6</span></div>
            </div>
        </div>
        <button id="restart-btn" class="btn btn-warning btn-lg shadow interactive-ui" onclick="resetGame()">
            Restart Game
        </button>
    </div>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Internal JS Logic -->
    <script>
        // --- Game Setup & State ---
        const TOTAL_PAIRS = 6;
        const CARD_COLORS = [
            0xff5733, 0x33ff57, 0x3357ff, 
            0xf333ff, 0xffff33, 0x33ffff
        ];

        let scene, camera, renderer;
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let isProcessing = false;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- Init Function ---
        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x121212);

            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Build Grid
            createBoard();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            // Animation Loop
            animate();
        }

        // --- Create Procedural Canvas Textures for Card Faces ---
        function createColorTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Background
            ctx.fillStyle = '#' + colorHex.toString(16).padStart(6, '0');
            ctx.fillRect(0, 0, 256, 256);

            // Inner Border
            ctx.lineWidth = 16;
            ctx.strokeStyle = '#ffffff';
            ctx.strokeRect(16, 16, 224, 224);

            return new THREE.CanvasTexture(canvas);
        }

        function createBackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 0, 256, 256);

            // Pattern
            ctx.fillStyle = '#34495e';
            for (let i = 0; i < 256; i += 32) {
                for (let j = 0; j < 256; j += 32) {
                    if ((i + j) % 64 === 0) {
                        ctx.fillRect(i, j, 32, 32);
                    }
                }
            }

            ctx.lineWidth = 12;
            ctx.strokeStyle = '#ecf0f1';
            ctx.strokeRect(10, 10, 236, 236);

            return new THREE.CanvasTexture(canvas);
        }

        // --- Board Generation ---
        function createBoard() {
            // Clear existing cards
            cards.forEach(card => scene.remove(card.mesh));
            cards = [];

            // Duplicate colors to make pairs and shuffle
            let colorPool = [...CARD_COLORS, ...CARD_COLORS];
            colorPool.sort(() => Math.random() - 0.5);

            const backTexture = createBackTexture();
            const cardGeometry = new THREE.BoxGeometry(1.6, 2.2, 0.1);

            const rows = 3;
            const cols = 4;
            const spacingX = 2.2;
            const spacingY = 2.8;

            let index = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const color = colorPool[index];
                    const frontTexture = createColorTexture(color);

                    // Materials array for BoxGeometry: [right, left, top, bottom, front, back]
                    const materials = [
                        new THREE.MeshStandardMaterial({ color: 0xcccccc }), // side
                        new THREE.MeshStandardMaterial({ color: 0xcccccc }), // side
                        new THREE.MeshStandardMaterial({ color: 0xcccccc }), // side
                        new THREE.MeshStandardMaterial({ color: 0xcccccc }), // side
                        new THREE.MeshStandardMaterial({ map: frontTexture }), // front
                        new THREE.MeshStandardMaterial({ map: backTexture })   // back
                    ];

                    const mesh = new THREE.Mesh(cardGeometry, materials);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    // Position cards relative to center
                    const posX = (c - (cols - 1) / 2) * spacingX;
                    const posY = ((rows - 1) / 2 - r) * spacingY;
                    mesh.position.set(posX, posY, 0);

                    // Start flipped (back facing camera)
                    mesh.rotation.y = Math.PI;

                    const cardObj = {
                        mesh: mesh,
                        color: color,
                        isFlipped: false,
                        isMatched: false,
                        targetRotationY: Math.PI
                    };

                    mesh.userData = cardObj; // Link object reference
                    scene.add(mesh);
                    cards.push(cardObj);

                    index++;
                }
            }
        }

        // --- Input Handling ---
        function onPointerDown(event) {
            if (isProcessing) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cards.map(c => c.mesh));

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const card = clickedMesh.userData;

                if (!card.isFlipped && !card.isMatched && flippedCards.length < 2) {
                    flipCard(card);
                }
            }
        }

        // --- Game Logic ---
        function flipCard(card) {
            card.isFlipped = true;
            card.targetRotationY = 0; // Rotate to face camera
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                document.getElementById('move-count').innerText = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isProcessing = true;
            const [card1, card2] = flippedCards;

            if (card1.color === card2.color) {
                // Match
                card1.isMatched = true;
                card2.isMatched = true;
                matchedPairs++;
                document.getElementById('match-count').innerText = `${matchedPairs} / ${TOTAL_PAIRS}`;
                flippedCards = [];
                isProcessing = false;

                if (matchedPairs === TOTAL_PAIRS) {
                    setTimeout(() => alert(`Congratulations! You won in ${moves} moves!`), 500);
                }
            } else {
                // No Match -> Flip back
                setTimeout(() => {
                    card1.isFlipped = false;
                    card1.targetRotationY = Math.PI;
                    card2.isFlipped = false;
                    card2.targetRotationY = Math.PI;
                    flippedCards = [];
                    isProcessing = false;
                }, 1000);
            }
        }

        function resetGame() {
            matchedPairs = 0;
            moves = 0;
            flippedCards = [];
            isProcessing = false;

            document.getElementById('move-count').innerText = moves;
            document.getElementById('match-count').innerText = `${matchedPairs} / ${TOTAL_PAIRS}`;

            createBoard();
        }

        // --- Render Loop & Smooth Animation ---
        function animate() {
            requestAnimationFrame(animate);

            // Smooth rotational lerp transition for flipping
            cards.forEach(card => {
                card.mesh.rotation.y += (card.targetRotationY - card.mesh.rotation.y) * 0.1;
            });

            renderer.render(scene, camera);
        }

        // --- Window Resize ---
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initialize scene
        init();
    </script>
</body>
</html>
